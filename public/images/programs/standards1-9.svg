<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="acadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#acadGrad)"/>
  <!-- Stack of Books and Geometry tools -->
  <!-- Book 1 (Blue) -->
  <rect x="80" y="160" width="160" height="32" rx="6" fill="#0284C7"/>
  <rect x="75" y="166" width="15" height="20" rx="3" fill="#38BDF8"/>
  <line x1="100" y1="176" x2="225" y2="176" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>

  <!-- Book 2 (Coral/Orange) -->
  <rect x="95" y="125" width="140" height="30" rx="6" fill="#F97316"/>
  <rect x="90" y="130" width="15" height="20" rx="3" fill="#FDBA74"/>
  <line x1="115" y1="140" x2="220" y2="140" stroke="#FFEDD5" stroke-width="3" stroke-linecap="round"/>

  <!-- Book 3 (Teal/Emerald) -->
  <rect x="110" y="90" width="120" height="30" rx="6" fill="#0D9488"/>
  <rect x="105" y="95" width="15" height="20" rx="3" fill="#5EEAD4"/>
  <line x1="130" y1="105" x2="215" y2="105" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>

  <!-- Compass & Ruler -->
  <g transform="translate(250, 70)">
    <!-- Ruler -->
    <rect x="20" y="20" width="30" height="120" rx="4" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <line x1="20" y1="40" x2="35" y2="40" stroke="#854D0E" stroke-width="2"/>
    <line x1="20" y1="60" x2="30" y2="60" stroke="#854D0E" stroke-width="1.5"/>
    <line x1="20" y1="80" x2="35" y2="80" stroke="#854D0E" stroke-width="2"/>
    <line x1="20" y1="100" x2="30" y2="100" stroke="#854D0E" stroke-width="1.5"/>
    <line x1="20" y1="120" x2="35" y2="120" stroke="#854D0E" stroke-width="2"/>
    <!-- Pencil -->
    <polygon points="65,10 80,10 75,130 70,130" fill="#3B82F6"/>
    <polygon points="70,130 75,130 72.5,145" fill="#FCD34D"/>
    <polygon points="72,142 73,142 72.5,145" fill="#1E293B"/>
  </g>

  <!-- Standards Badge -->
  <rect x="120" y="215" width="160" height="28" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <text x="200" y="234" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#0369A1">Standards 1 to 9</text>
</svg>
