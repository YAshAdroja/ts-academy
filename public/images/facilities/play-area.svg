<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="16" fill="#FEF2F2"/>
  <!-- Playground Slide & Soft play blocks -->
  <g transform="translate(60, 40)">
    <!-- Ladder -->
    <line x1="40" y1="30" x2="40" y2="180" stroke="#DC2626" stroke-width="6"/>
    <line x1="70" y1="30" x2="70" y2="180" stroke="#DC2626" stroke-width="6"/>
    <line x1="40" y1="60" x2="70" y2="60" stroke="#F59E0B" stroke-width="4"/>
    <line x1="40" y1="90" x2="70" y2="90" stroke="#F59E0B" stroke-width="4"/>
    <line x1="40" y1="120" x2="70" y2="120" stroke="#F59E0B" stroke-width="4"/>
    <line x1="40" y1="150" x2="70" y2="150" stroke="#F59E0B" stroke-width="4"/>

    <!-- Slide ramp -->
    <path d="M70 40 C140 40 180 140 240 180 L230 188 C170 150 130 50 65 48 Z" fill="#0284C7"/>
    <!-- Soft Balls in play area -->
    <circle cx="210" cy="200" r="16" fill="#EF4444"/>
    <circle cx="235" cy="205" r="14" fill="#FACC15"/>
    <circle cx="185" cy="208" r="15" fill="#10B981"/>
    <circle cx="260" cy="202" r="13" fill="#8B5CF6"/>
  </g>
  <rect x="120" y="240" width="160" height="26" rx="13" fill="#FFFFFF" opacity="0.9"/>
  <text x="200" y="258" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#E11D48">Safe &amp; Joyful Play Area</text>
</svg>
