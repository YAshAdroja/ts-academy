<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="16" fill="#F0FDF4"/>
  <!-- Blackboard -->
  <rect x="60" y="40" width="280" height="130" rx="8" fill="#15803D" stroke="#854D0E" stroke-width="6"/>
  <rect x="70" y="50" width="260" height="110" rx="4" fill="#14532D"/>
  <text x="200" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#FEF08A">Welcome to Class</text>
  <text x="200" y="135" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#BBF7D0">Concept Clarity &amp; Practice</text>
  <!-- Chalk & Duster tray -->
